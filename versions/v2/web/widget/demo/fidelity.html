<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FarmerChat Fidelity</title>
  <style>
    /* Phone-frame harness for pixel comparison with Android (rs_qa: 1080x2400 @420dpi).
       Pads by Android's status bar (128px = 48.76dp); the nav bar (63px = 24dp) is passed
       as an inset, as Android passes WindowInsets. */
    html, body { margin: 0; height: 100%; background: #fff; }
    /* The nav bar is NOT padded out: Compose draws under it and insets its own content, so the
       harness hands the SDK the same inset through --farmerchat-inset-bottom instead. */
    #fc { position: fixed; left: 0; right: 0; top: 48.76px; bottom: 0; --farmerchat-inset-bottom: 24px; }
  </style>
</head>
<body>
  <div id="fc"></div>
  <script src="../dist/farmerchat-widget.iife.js"></script>
  <script>
    var q = new URLSearchParams(location.search);
    FarmerChatWidget.sdk.mount(document.getElementById('fc'), {
      inline: true,
      config: {
        environment: 'dev',
        // The harness compares the full app journey (onboarding, Home), not the chat-only default.
        mode: q.get('mode') || 'FULL_JOURNEY',
        customBaseUrl: q.get('base') || 'http://localhost:8898/',
        enableAgenticChat: q.get('agentic') !== '0',
        assetBaseUrl: new URL('../dist/illustrations/', location.href).href,
        // ?theme=blue — the example app's host palette, to check host theming end to end.
        theme: q.get('theme') === 'blue' ? {
          colors: { brandPrimary: '#1565C0', brandPrimaryDark: '#0D47A1', brandAccent: '#42A5F5', onBrand: '#ffffff' },
          dark: { brandPrimary: '#1E88E5', brandPrimaryDark: '#1565C0', brandAccent: '#64B5F6', onBrand: '#ffffff' },
          shape: { cardCornerRadius: 16, buttonCornerRadius: 12, inputCornerRadius: 12 },
        } : undefined,
        appearance: q.get('appearance') || 'day',
        // Same data as the Android device (India). Only a FALLBACK: the bundled geo key now
        // geolocates the browser by IP first, so these apply when that call fails.
        defaultCountryCode: q.get('country') || 'IN',
        defaultLatitude: Number(q.get('lat') || 12.9716),
        defaultLongitude: Number(q.get('lng') || 77.5946),
      },
    });
  </script>
</body>
</html>
