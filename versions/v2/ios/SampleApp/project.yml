name: SampleApp
options:
  bundleIdPrefix: org.digitalgreen.farmerchat
  deploymentTarget:
    iOS: "16.0"
packages:
  FarmerChatCore:
    path: ../FarmerChatCore
  FarmerChatSwiftUI:
    path: ../FarmerChatSwiftUI
  FarmerChatUIKit:
    path: ../FarmerChatUIKit
targets:
  SampleApp:
    type: application
    platform: iOS
    sources:
      - SampleApp
    dependencies:
      - package: FarmerChatCore
        product: FarmerChatCore
      - package: FarmerChatSwiftUI
        product: FarmerChatSwiftUI
      - package: FarmerChatUIKit
        product: FarmerChatUIKit
    # Explicit Info.plist (generated by xcodegen) so we can add the nested
    # App Transport Security dictionary — see NSAppTransportSecurity below.
    info:
      path: SampleApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "FarmerChat uses the microphone to record voice questions."
        NSCameraUsageDescription: "FarmerChat uses the camera to capture crop photos for questions."
        NSPhotoLibraryUsageDescription: "FarmerChat lets you pick crop photos from your library."
        NSPhotoLibraryAddUsageDescription: "FarmerChat saves answer cards to your photo library."
        NSLocationWhenInUseUsageDescription: "FarmerChat uses your location for weather and local advice."
        # SAMPLE-APP ONLY. Permit cleartext HTTP to the local mock backend
        # (tools/mock-server) for e2e verification. Never ship this in an SDK.
        # iOS simulator reaches the mock at http://localhost:8899/.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.digitalgreen.farmerchat.sample
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"   # ad-hoc: simulator keychain needs a signed app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
