name: ConsumerApp
# Distribution proof: this target links the PREBUILT .xcframework binaries from
# ../dist (produced by ../build-xcframework.sh) — NOT the in-repo source
# packages. It imports all three SDK modules from their compiled .swiftinterface
# and exercises the public API + both UI entry points. Building this for the
# simulator proves the SDK is consumable as a binary artifact.
options:
  bundleIdPrefix: org.digitalgreen.farmerchat
  deploymentTarget:
    iOS: "16.0"
targets:
  ConsumerApp:
    type: application
    platform: iOS
    sources:
      - ConsumerApp
    dependencies:
      - framework: ../dist/FarmerChatCore.xcframework
        embed: true
      - framework: ../dist/FarmerChatSwiftUI.xcframework
        embed: true
      - framework: ../dist/FarmerChatUIKit.xcframework
        embed: true
    # Explicit Info.plist (generated by xcodegen) so we can add the nested
    # App Transport Security dictionary — see NSAppTransportSecurity below.
    info:
      path: ConsumerApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Voice questions."
        NSCameraUsageDescription: "Crop photos."
        NSPhotoLibraryUsageDescription: "Pick crop photos."
        NSLocationWhenInUseUsageDescription: "Local weather advice."
        # SAMPLE-APP ONLY. Permit cleartext HTTP to the local mock backend
        # (tools/mock-server) for e2e verification. Never ship this in an SDK.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.digitalgreen.farmerchat.consumer
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
