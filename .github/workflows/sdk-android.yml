# Builds and unit-tests the v2 Android SDK. Test-only: never publishes or deploys (CLAUDE.md §8).
name: SDK Android (v2)
on:
  push:
    paths: ['versions/v2/android/**', '.github/workflows/sdk-android.yml']
  pull_request:
    paths: ['versions/v2/android/**', '.github/workflows/sdk-android.yml']
concurrency:
  group: sdk-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: versions/v2/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # sample-consumer resolves the SDK from Maven Central and is excluded below until the
      # first release is published there; publishToMavenLocal still proves the artifacts publish.
      - run: ./gradlew publishToMavenLocal
      - run: ./gradlew testDebugUnitTest assembleDebug -x :sample-consumer:assembleDebug -x :sample-consumer:testDebugUnitTest
