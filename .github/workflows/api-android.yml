# Public-API, size and API-reference checks for the v2 Android SDK.
# Test-only: never publishes or deploys (CLAUDE.md §8). Build + unit tests live in sdk-android.yml.
name: API Android (v2)
on:
  push:
    paths: ['versions/v2/android/**', '.github/workflows/api-android.yml']
  pull_request:
    paths: ['versions/v2/android/**', '.github/workflows/api-android.yml']
concurrency:
  group: api-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: versions/v2/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Fails if the compiled public API differs from the committed <module>/api/*.api baselines.
      # An intended change: run `./gradlew apiDump` and commit the .api diff.
      - name: Public API compatibility (apiCheck)
        run: ./gradlew apiCheck
      # Fails if any release AAR exceeds its budget in size-budget.properties.
      - name: Release AAR size budget
        run: scripts/check-aar-size.sh
      - name: API reference (Dokka HTML)
        run: ./gradlew :dokkaGenerate
      - uses: actions/upload-artifact@v4
        with:
          name: farmerchat-android-api-reference
          path: versions/v2/android/build/dokka/html
          if-no-files-found: error
