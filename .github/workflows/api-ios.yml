# Public-API break check + DocC archives for the v2 iOS SDK. Test-only: nothing is published.
#
# API check: `swift package diagnose-api-breaking-changes` assumes the package root IS the git
# root (it clones the package directory as a repo), so run directly in versions/v2/ios/FarmerChatCore
# it fails with "repository ... does not exist". We therefore snapshot FarmerChatCore at the
# baseline and at HEAD into a throwaway two-commit repo and diff there. Only FarmerChatCore is
# checked: the tool builds with `swift build` for macOS, and FarmerChatSwiftUI / FarmerChatUIKit
# are iOS-only, so their public API is NOT break-checked here.
name: API iOS (v2)
on:
  push:
    paths: ['versions/v2/ios/**', 'Package.swift', '.github/workflows/api-ios.yml']
  pull_request:
    paths: ['versions/v2/ios/**', 'Package.swift', '.github/workflows/api-ios.yml']
concurrency:
  group: api-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-and-docs:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the API check needs the baseline commit

      - name: Pick API baseline
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base=$PUSH_BEFORE
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "API baseline: $base"

      - name: FarmerChatCore public API vs baseline
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PKG: versions/v2/ios/FarmerChatCore
        run: |
          set -euo pipefail
          repo=$PWD
          work=$RUNNER_TEMP/apidiff-core
          depth=$(awk -F/ '{print NF}' <<<"$PKG")
          if ! git cat-file -e "$BASE:$PKG/Package.swift" 2>/dev/null; then
            echo "FarmerChatCore does not exist at $BASE; nothing to compare."; exit 0
          fi
          mkdir -p "$work"; cd "$work"; git init -q
          snap() {
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            git -C "$repo" archive "$1" "$PKG" | tar -x --strip-components="$depth"
            git add -A
            git -c user.email=ci@local -c user.name=ci commit -q --allow-empty -m "$1"
          }
          snap "$BASE"
          snap HEAD
          # Exits non-zero when a breaking change is found.
          swift package diagnose-api-breaking-changes HEAD~1 --products FarmerChatCore

      - name: DocC archives (iOS Simulator)
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/docc
          mkdir -p "$out"
          for p in FarmerChatCore FarmerChatSwiftUI FarmerChatUIKit; do
            (cd "versions/v2/ios/$p" && xcodebuild docbuild -scheme "$p" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/docc-dd/$p" -quiet)
            # Zipped: a .doccarchive is ~30k files, some named like `init(from:).json`, and
            # upload-artifact rejects colons in paths.
            ditto -c -k --keepParent \
              "$RUNNER_TEMP/docc-dd/$p/Build/Products/Debug-iphonesimulator/$p.doccarchive" \
              "$out/$p.doccarchive.zip"
          done
          ls "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: farmerchat-ios-docc
          path: ${{ runner.temp }}/docc
          if-no-files-found: error
